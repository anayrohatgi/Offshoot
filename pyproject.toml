[project]
name = "lit-orchestrator"
version = "1.0.0"
description = "Offshoot: turns the open questions in new bio x AI papers into scoped project drafts"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
offshoot = "lit_orchestrator.coordinator.coordinator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
